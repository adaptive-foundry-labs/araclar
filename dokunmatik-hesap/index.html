<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hesap Makinesi</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculator">
        <div class="display">
            <div class="output" id="output">0</div>
        </div>
        <div class="buttons">
            <button class="btn ac" id="btn-ac">AC</button>
            <button class="btn op" id="btn-sign">+/-</button>
            <button class="btn op" id="btn-percent">%</button>
            <button class="btn op" id="btn-divide">÷</button>
            
            <button class="btn num" id="btn-7">7</button>
            <button class="btn num" id="btn-8">8</button>
            <button class="btn num" id="btn-9">9</button>
            <button class="btn op" id="btn-multiply">×</button>
            
            <button class="btn num" id="btn-4">4</button>
            <button class="btn num" id="btn-5">5</button>
            <button class="btn num" id="btn-6">6</button>
            <button class="btn op" id="btn-minus">−</button>
            
            <button class="btn num" id="btn-1">1</button>
            <button class="btn num" id="btn-2">2</button>
            <button class="btn num" id="btn-3">3</button>
            <button class="btn op" id="btn-plus">+</button>
            
            <button class="btn num zero" id="btn-0">0</button>
            <button class="btn num" id="btn-dot">.</button>
            <button class="btn equals" id="btn-equals">=</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
