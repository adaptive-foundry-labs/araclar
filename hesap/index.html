<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hesap Makinesi v2</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg,#1e1e2f,#2b2b45);
    font-family: 'Segoe UI', Arial, sans-serif;
  }
  .calculator {
    width: 320px;
    background: #24243a;
    border-radius: 16px;
    padding: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    position: relative;
  }
  .mute-btn {
    position: absolute;
    top: 16px;
    right: 16px;
    width: 36px;
    height: 36px;
    border: none;
    border-radius: 8px;
    background: #35355a;
    color: #fff;
    font-size: 18px;
    cursor: pointer;
    transition: background 0.15s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }
  .mute-btn:hover { background: #40406b; }
  .display {
    background: #14141f;
    border-radius: 10px;
    padding: 20px 16px;
    margin-bottom: 14px;
    margin-top: 8px;
    text-align: right;
    color: #fff;
    min-height: 76px;
  }
  .display .intermediate {
    font-size: 14px;
    color: #9a9ac0;
    min-height: 18px;
    word-break: break-all;
  }
  .display .expr {
    font-size: 14px;
    color: #9a9ac0;
    min-height: 18px;
    word-break: break-all;
  }
  .display .current {
    font-size: 32px;
    font-weight: 600;
    word-break: break-all;
  }
  .buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }
  button {
    border: none;
    border-radius: 10px;
    padding: 18px 0;
    font-size: 18px;
    cursor: pointer;
    color: #fff;
    background: #35355a;
    transition: transform 0.05s ease, background 0.15s ease;
  }
  button:hover { background: #40406b; }
  button:active { transform: scale(0.96); }
  button.op { background: #4a4a7a; }
  button.op:hover { background: #57579091; }
  button.equal { background: #ff9f43; }
  button.equal:hover { background: #ffb266; }
  button.clear { background: #e74c3c; }
  button.clear:hover { background: #ff6a5a; }
  button.wide { grid-column: span 2; }
  button.error-shake { animation: shake 0.3s; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }
</style>
</head>
<body>
<div class="calculator">
  <button class="mute-btn" id="mute-btn" title="Sesi Aç/Kapat">🔊</button>
  <div class="display">
    <div class="intermediate" id="intermediate"></div>
    <div class="expr" id="expr"></div>
    <div class="current" id="current">0</div>
  </div>
  <div class="buttons">
    <button class="clear" data-action="clear">C</button>
    <button data-action="sign">+/-</button>
    <button data-action="percent">%</button>
    <button class="op" data-action="divide">÷</button>

    <button data-digit="7">7</button>
    <button data-digit="8">8</button>
    <button data-digit="9">9</button>
    <button class="op" data-action="multiply">×</button>

    <button data-digit="4">4</button>
    <button data-digit="5">5</button>
    <button data-digit="6">6</button>
    <button class="op" data-action="subtract">−</button>

    <button data-digit="1">1</button>
    <button data-digit="2">2</button>
    <button data-digit="3">3</button>
    <button class="op" data-action="add">+</button>

    <button class="wide" data-digit="0">0</button>
    <button data-action="decimal">.</button>
    <button class="equal" data-action="equals">=</button>
  </div>
</div>

<script>
(function () {
  'use strict';

  var state = {
    currentValue: '0',
    previousValue: null,
    operator: null,
    overwrite: true,
    error: false
  };

  var audioContext = null;
  var isMuted = localStorage.getItem('hm-mute') === 'true';
  var muteBtn = document.getElementById('mute-btn');
  var currentEl = document.getElementById('current');
  var exprEl = document.getElementById('expr');
  var intermediateEl = document.getElementById('intermediate');

  var OP_SYMBOLS = {
    add: '+',
    subtract: '−',
    multiply: '×',
    divide: '÷'
  };

  function updateMuteButton() {
    muteBtn.textContent = isMuted ? '🔇' : '🔊';
  }

  function initAudioContext() {
    if (audioContext) return;
    var CtxClass = window.AudioContext || window.webkitAudioContext;
    if (CtxClass) {
      audioContext = new CtxClass();
    }
  }

  function playClickSound() {
    if (isMuted || !audioContext) return;
    try {
      var now = audioContext.currentTime;
      var osc = audioContext.createOscillator();
      var gain = audioContext.createGain();
      osc.type = 'sine';
      osc.frequency.value = 800;
      osc.connect(gain);
      gain.connect(audioContext.destination);
      gain.gain.setValueAtTime(0.1, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
      osc.start(now);
      osc.stop(now + 0.08);
    } catch (e) {}
  }

  muteBtn.addEventListener('click', function () {
    isMuted = !isMuted;
    localStorage.setItem('hm-mute', isMuted);
    updateMuteButton();
  });

  function formatNumber(numStr) {
    if (numStr === '' || numStr === '-') return numStr;
    var num = Number(numStr);
    if (!isFinite(num)) return 'Hata';
    var str = String(num);
    if (str.length > 14) {
      str = num.toPrecision(10);
      str = Number(str).toString();
    }
    return str;
  }

  function updateDisplay() {
    currentEl.textContent = state.error ? 'Hata' : formatNumber(state.currentValue);
    if (state.error) {
      exprEl.textContent = '';
      intermediateEl.textContent = '';
      return;
    }
    if (state.operator && state.previousValue !== null) {
      exprEl.textContent = formatNumber(state.previousValue) + ' ' + OP_SYMBOLS[state.operator];
      intermediateEl.textContent = '';
    } else {
      exprEl.textContent = '';
      intermediateEl.textContent = '';
    }
  }

  function updateIntermediateResult() {
    if (!state.error && state.operator && state.previousValue !== null && !state.overwrite) {
      var result = compute(state.previousValue, state.currentValue, state.operator);
      if (result !== null) {
        intermediateEl.textContent = '= ' + formatNumber(String(result));
      } else {
        intermediateEl.textContent = '';
      }
    } else {
      intermediateEl.textContent = '';
    }
  }

  function triggerErrorAnim() {
    var disp = document.querySelector('.display');
    disp.classList.remove('error-shake');
    void disp.offsetWidth;
    disp.classList.add('error-shake');
  }

  function resetAll() {
    state.currentValue = '0';
    state.previousValue = null;
    state.operator = null;
    state.overwrite = true;
    state.error = false;
  }

  function inputDigit(d) {
    if (state.error) { resetAll(); }
    if (state.overwrite) {
      state.currentValue = (d === '0') ? '0' : d;
      state.overwrite = false;
    } else {
      if (state.currentValue === '0') {
        state.currentValue = d;
      } else {
        if (state.currentValue.replace('-', '').length >= 15) return;
        state.currentValue += d;
      }
    }
  }

  function inputDecimal() {
    if (state.error) { resetAll(); }
    if (state.overwrite) {
      state.currentValue = '0.';
      state.overwrite = false;
      return;
    }
    if (state.currentValue.indexOf('.') === -1) {
      state.currentValue += '.';
    }
  }

  function toggleSign() {
    if (state.error) return;
    if (state.currentValue === '0') return;
    if (state.currentValue.charAt(0) === '-') {
      state.currentValue = state.currentValue.slice(1);
    } else {
      state.currentValue = '-' + state.currentValue;
    }
  }

  function applyPercent() {
    if (state.error) return;
    var val = parseFloat(state.currentValue);
    if (isNaN(val)) return;
    var result;
    if (state.operator && state.previousValue !== null) {
      var base = parseFloat(state.previousValue);
      result = (base * val) / 100;
    } else {
      result = val / 100;
    }
    state.currentValue = String(result);
    state.overwrite = true;
  }

  function compute(a, b, op) {
    a = parseFloat(a);
    b = parseFloat(b);
    switch (op) {
      case 'add': return a + b;
      case 'subtract': return a - b;
      case 'multiply': return a * b;
      case 'divide':
        if (b === 0) return null;
        return a / b;
      default: return b;
    }
  }

  function chooseOperator(op) {
    if (state.error) return;
    if (state.operator && !state.overwrite) {
      var result = compute(state.previousValue, state.currentValue, state.operator);
      if (result === null) {
        setError();
        return;
      }
      state.previousValue = String(result);
      state.currentValue = String(result);
    } else {
      state.previousValue = state.currentValue;
    }
    state.operator = op;
    state.overwrite = true;
    updateDisplay();
  }

  function setError() {
    state.error = true;
    state.currentValue = 'Hata';
    state.previousValue = null;
    state.operator = null;
    state.overwrite = true;
    triggerErrorAnim();
  }

  function equals() {
    if (state.error) return;
    if (state.operator === null || state.previousValue === null) return;
    var result = compute(state.previousValue, state.currentValue, state.operator);
    if (result === null) {
      setError();
      return;
    }
    state.currentValue = String(result);
    state.previousValue = null;
    state.operator = null;
    state.overwrite = true;
  }

  function handleAction(action) {
    switch (action) {
      case 'clear': resetAll(); break;
      case 'sign': toggleSign(); break;
      case 'percent': applyPercent(); break;
      case 'add':
      case 'subtract':
      case 'multiply':
      case 'divide': chooseOperator(action); break;
      case 'decimal': inputDecimal(); break;
      case 'equals': equals(); break;
    }
    updateDisplay();
    updateIntermediateResult();
  }

  document.querySelectorAll('button[data-digit]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      initAudioContext();
      playClickSound();
      if (state.error) resetAll();
      inputDigit(btn.getAttribute('data-digit'));
      updateDisplay();
      updateIntermediateResult();
    });
  });

  document.querySelectorAll('button[data-action]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      initAudioContext();
      playClickSound();
      handleAction(btn.getAttribute('data-action'));
    });
  });

  document.addEventListener('keydown', function (e) {
    var key = e.key;
    if (key >= '0' && key <= '9') {
      initAudioContext();
      playClickSound();
      if (state.error) resetAll();
      inputDigit(key);
      updateDisplay();
      updateIntermediateResult();
      return;
    }
    switch (key) {
      case '.':
      case ',':
        initAudioContext();
        playClickSound();
        inputDecimal();
        updateDisplay();
        updateIntermediateResult();
        break;
      case '+':
        initAudioContext();
        playClickSound();
        handleAction('add');
        break;
      case '-':
        initAudioContext();
        playClickSound();
        handleAction('subtract');
        break;
      case '*':
        initAudioContext();
        playClickSound();
        handleAction('multiply');
        break;
      case '/':
        e.preventDefault();
        initAudioContext();
        playClickSound();
        handleAction('divide');
        break;
      case '%':
        initAudioContext();
        playClickSound();
        handleAction('percent');
        break;
      case 'Enter':
      case '=':
        e.preventDefault();
        initAudioContext();
        playClickSound();
        handleAction('equals');
        break;
      case 'Escape':
        initAudioContext();
        playClickSound();
        handleAction('clear');
        break;
      case 'Backspace':
        initAudioContext();
        playClickSound();
        if (state.error) { resetAll(); updateDisplay(); break; }
        if (!state.overwrite && state.currentValue.length > 1) {
          state.currentValue = state.currentValue.slice(0, -1);
          if (state.currentValue === '-' || state.currentValue === '') {
            state.currentValue = '0';
            state.overwrite = true;
          }
        } else {
          state.currentValue = '0';
          state.overwrite = true;
        }
        updateDisplay();
        updateIntermediateResult();
        break;
      default:
        break;
    }
  });

  updateMuteButton();
  updateDisplay();
})();
</script>
</body>
</html>
